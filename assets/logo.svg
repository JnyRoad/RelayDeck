<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">RelayDeck</title>
  <desc id="desc">Three layered relay nodes routing requests through a unified platform.</desc>
  <defs>
    <linearGradient id="relaydeck-surface" x1="64" y1="40" x2="448" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152A52"/>
      <stop offset=".52" stop-color="#0A1834"/>
      <stop offset="1" stop-color="#050D20"/>
    </linearGradient>
    <radialGradient id="relaydeck-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(270 160) rotate(112) scale(330 350)">
      <stop stop-color="#3D7DFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#3D7DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="relaydeck-accent" x1="132" y1="152" x2="386" y2="366" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76F5C2"/>
      <stop offset=".5" stop-color="#35D8E9"/>
      <stop offset="1" stop-color="#5C70FF"/>
    </linearGradient>
    <filter id="relaydeck-shadow" x="-30%" y="-35%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020817" flood-opacity=".44"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#relaydeck-surface)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#relaydeck-glow)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="119.25" fill="none" stroke="#A5C8FF" stroke-opacity=".18" stroke-width="1.5"/>

  <g fill="none" stroke="url(#relaydeck-accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="18" filter="url(#relaydeck-shadow)">
    <path d="M144 178h126c34 0 62 28 62 62v22"/>
    <path d="M180 256h88c35 0 64 29 64 64v14"/>
    <path d="M216 334h82"/>
  </g>
  <g fill="url(#relaydeck-accent)" filter="url(#relaydeck-shadow)">
    <rect x="108" y="140" width="72" height="72" rx="24"/>
    <rect x="296" y="226" width="72" height="72" rx="24"/>
    <rect x="296" y="316" width="72" height="72" rx="24"/>
  </g>
  <g fill="#E9FFFF">
    <circle cx="144" cy="176" r="10"/>
    <circle cx="332" cy="262" r="10"/>
    <circle cx="332" cy="352" r="10"/>
  </g>
</svg>
